services:
  it-helpdesk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it-helpdesk-lakhan
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=http://localhost:3000
    volumes:
      # Persistent storage for tickets, users, assets, and audit logs
      - helpdesk_data:/app/data
      # Alternatively, to mount directly to a folder on your Ubuntu host, comment out above and uncomment:
      # - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  helpdesk_data:
    driver: local
