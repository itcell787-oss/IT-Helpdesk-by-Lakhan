version: '3.8'

services:
  it-helpdesk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it-helpdesk-lakhan
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=http://localhost:3000
    volumes:
      - helpdesk_data:/app/data

volumes:
  helpdesk_data:
    driver: local
